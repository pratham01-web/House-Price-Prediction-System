services:
  - type: web
    name: realestateiq-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: house-price-db
          property: connectionString
      - key: MODEL_REGISTRY_DIR
        value: ml/models
      - key: ACTIVE_MODEL_VERSION
        value: v1.0.0
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  - name: house-price-db
    databaseName: house_price_db
    user: postgres
    plan: free
