services:
  postgres:
    image: postgres:16-alpine
    container_name: house_price_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-house_price_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-house_price_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - house_price_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: house_price_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-house_price_db}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-house_price_db}
      MODEL_REGISTRY_DIR: ml/models
      ACTIVE_MODEL_VERSION: ${ACTIVE_MODEL_VERSION:-v1.0.0}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./ml/models:/app/ml/models:ro
    networks:
      - house_price_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: house_price_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - house_price_net

volumes:
  postgres_data:
    driver: local

networks:
  house_price_net:
    driver: bridge
